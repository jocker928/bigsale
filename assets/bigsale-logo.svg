<svg xmlns="http://www.w3.org/2000/svg" width="841" height="595" viewBox="0 0 841 595" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">BIG SALE — Great sale on big brands</title>
  <desc id="logo-description">Red and white serif monogram above the BIG SALE wordmark and tagline, on a near-black background.</desc>
  <rect width="841" height="595" fill="#0b0b09"/>

  <!-- Overlapping red T and white M monogram from the supplied reference. -->
  <text x="300" y="260" fill="#e3232b" font-family="Didot, Bodoni 72, 'Times New Roman', serif" font-size="180" font-weight="700">T</text>
  <text x="376" y="300" fill="#ffffff" font-family="Didot, Bodoni 72, 'Times New Roman', serif" font-size="180" font-weight="700">M</text>

  <!-- BIG SALE wordmark -->
  <text x="145" y="410" fill="#e3232b" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="400" letter-spacing="-2">BIG</text>
  <text x="378" y="410" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="400" letter-spacing="-2">SALE</text>

  <!-- Tagline ribbon -->
  <rect x="149" y="424" width="540" height="39" fill="#e3232b"/>
  <text x="419" y="455" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="0.2">Great sale on big brands</text>
</svg>
