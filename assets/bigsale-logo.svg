<svg xmlns="http://www.w3.org/2000/svg" width="841" height="595" viewBox="0 0 841 595" role="img" aria-labelledby="title desc">
  <title id="title">BIG SALE — Great sale on big brands</title>
  <desc id="desc">The BIG SALE logo with an overlapping red T and white M monogram on a black background.</desc>
  <rect width="841" height="595" fill="#0b0b09"/>
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="372" y="260" font-size="178" fill="#e5232b">T</text>
    <text x="460" y="300" font-size="178" fill="#fff">M</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="400" letter-spacing="-2">
    <text x="145" y="410" fill="#e5232b">BIG</text>
    <text x="378" y="410" fill="#fff">SALE</text>
  </g>
  <rect x="149" y="424" width="540" height="39" fill="#e5232b"/>
  <text x="419" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#fff">Great sale on big brands</text>
</svg>
