<svg xmlns="http://www.w3.org/2000/svg" width="841" height="595" viewBox="0 0 841 595" role="img" aria-labelledby="title desc">
  <title id="title">BIG SALE — Great sale on big brands</title>
  <desc id="desc">The supplied BIG SALE logo: overlapping red T and white M monogram above BIG SALE and its tagline on a black background.</desc>
  <rect width="841" height="595" fill="#0b0b09"/>

  <!-- Serif monogram, layered as in the supplied reference. -->
  <text x="292" y="260" fill="#e3232b" font-family="Bodoni 72, Didot, 'Times New Roman', serif" font-size="180" font-weight="700">T</text>
  <text x="374" y="300" fill="#fff" font-family="Bodoni 72, Didot, 'Times New Roman', serif" font-size="180" font-weight="700">M</text>

  <!-- Main wordmark -->
  <text x="142" y="410" fill="#e3232b" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="400" letter-spacing="-2">BIG</text>
  <text x="377" y="410" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="400" letter-spacing="-2">SALE</text>

  <!-- Tagline ribbon -->
  <rect x="149" y="424" width="540" height="39" fill="#e3232b"/>
  <text x="419" y="455" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="0.2">Great sale on big brands</text>
</svg>
