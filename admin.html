<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIGSALE Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script defer src="js/admin.js"></script></head><body><header class="topbar admin-top"><a class="brand" href="index.html"><img src="assets/bigsale-logo.png" alt="BIGSALE"></a><div><span id="adminIdentity" class="muted"></span> <button id="logout" class="button small">Logout</button></div></header><main class="admin-wrap"><div class="section-head"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin dashboard</h1></div><a class="button secondary" href="index.html">View shop</a></div><div class="admin-layout"><section class="panel"><h2 id="formTitle">Add product</h2><form id="productForm"><input type="hidden" id="productId"><label>Product name<input id="productName" required maxlength="120"></label><label>Description<textarea id="description" rows="3"></textarea></label><div class="two"><label>Category<input id="category" placeholder="e.g. Men"></label><label>Stock quantity<input id="stock" type="number" min="0" value="0" required></label></div><div class="two"><label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label><label>Offer price (₹)<input id="offerPrice" type="number" min="0" step="0.01"></label></div><label>Sizes (comma separated)<input id="sizes" placeholder="S, M, L, XL"></label><label>Colours (comma separated)<input id="colours" placeholder="Black, White"></label><label>Product photo<input id="photo" type="file" accept="image/*"></label><button class="button full" id="saveProduct">Save product</button><button type="button" id="cancelEdit" class="button secondary full hidden">Cancel edit</button><p id="adminMessage" class="message"></p></form></section><section class="panel"><div class="section-head"><h2>Products</h2><button id="refresh" class="button small secondary">Refresh</button></div><div id="adminProducts" class="admin-products">Loading…</div></section></div><section id="staffPanel" class="panel staff-panel hidden"><h2>Staff accounts</h2><p class="muted">Only the Super Admin can promote an existing registered customer to Staff Admin.</p><form id="staffForm" class="inline-form"><input id="staffEmail" type="email" placeholder="Registered staff email" required><button class="button">Add staff admin</button></form><p id="staffMessage" class="message"></p></section></main></body></html>
